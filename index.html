    <script>
      // Runtime safety patch for Google AI Studio iframe & browser environment
      // Prevents "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = typeof fn === 'function' ? fn : originalFetch;
                }
              });
            } catch (err) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                try {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    configurable: true,
                    enumerable: true,
                    get: function() {
                      return currentFetch;
                    },
                    set: function(fn) {
                      currentFetch = typeof fn === 'function' ? fn : originalFetch;
                    }
                  });
                } catch (e2) {}
              }
            }
          }
        } catch (e) {}

        // Google Maps Referer restriction graceful interceptor
        try {
          var origConsoleError = console.error;
          console.error = function() {
            var msg = arguments && arguments[0] ? String(arguments[0]) : '';
            if (msg.indexOf('RefererNotAllowedMapError') !== -1 || (msg.indexOf('Google Maps JavaScript API error') !== -1 && msg.indexOf('RefererNotAllowed') !== -1)) {
              console.warn('[Google Maps Resiliência] Restrição de Referer detectada na chave do usuário. Fallback automático ativado.');
              return;
            }
            return origConsoleError.apply(console, arguments);
          };
          window.addEventListener('error', function(event) {
            var errorMsg = event && (event.message || (event.error && event.error.message)) ? String(event.message || event.error.message) : '';
            if (errorMsg.indexOf('RefererNotAllowedMapError') !== -1) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, true);
        } catch (e3) {}
      })();
    </script>
